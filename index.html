<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Perfume</title>

  <style>
 
    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      color: #fff;

     background:
  radial-gradient(circle at 20% 30%, rgba(245, 215, 110, 0.10), transparent 45%),
  radial-gradient(circle at 80% 30%, rgba(245, 215, 110, 0.08), transparent 45%), 
  radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.04), transparent 45%),
  radial-gradient(circle at center, rgba(255,255,255,0.03), transparent 60%),
  linear-gradient(to bottom, #0f0f0f, #1a1a1a, #222);

      background-blend-mode: screen;
    }

   
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.015) 0px,
        rgba(255,255,255,0.015) 1px,
        transparent 1px,
        transparent 50px
      );

      pointer-events: none;
    }


    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: radial-gradient(
        circle,
        transparent 60%,
        rgba(0,0,0,0.6) 100%
      );

      pointer-events: none;
    }

 header {
  position: relative;
  text-align: center;
  padding: 80px 20px;
  border-bottom: 1px solid rgba(245, 215, 110, 0.2);
  overflow: hidden; 
}

header::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: url('bg2.jpg') no-repeat center top; 
  background-size: cover;
  filter: blur(5px); 
  transform: scale(1.1); 
  z-index: 0;
}


header .logo,
header h1,
header .cta {
  position: relative;
  z-index: 1; 
}





    .logo {
  display: block;
  margin-left: auto;
  margin-right: auto;
  margin-bottom: 20px;
  width: 350px;
  opacity: 0.9;
  filter: drop-shadow(0 0 15px rgba(245, 215, 110, 0.3));
  transition: 0.3s;
}


    .logo:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    header h1 {
      font-size: 3em;
      color: #f5d76e;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2em;
      color: #ccc;
    }

    .cta {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background-color: #d3d1ca;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      transition: 0.3s;
    }

    .cta:hover {
      background-color: #fff;
      color: #111;
      transform: scale(1.05); 
    }

    section {
      padding: 60px 20px;
      text-align: center;

      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);

      margin: 40px 20px;
      border-radius: 20px;

      border: 1px solid rgba(245, 215, 110, 0.15);
    }

    section h2 {
      font-size: 2em;
      color: #f5d76e;
      margin-bottom: 20px;
    }

    section p {
      max-width: 600px;
      margin: auto;
      color: #ddd;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 30px;

      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);

      border-top: 1px solid rgba(245, 215, 110, 0.2);

      color: #888;
      font-size: 0.9em;
    }

    .footer-tagline {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(245, 215, 110, 0.3);
  margin: 4px 0 14px;
}
.visit-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(245, 215, 110, 0.08);
  border: 0.5px solid rgba(245, 215, 110, 0.35);
  border-radius: 40px;
  padding: 10px 22px;
}
.visit-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(245, 215, 110, 0.15);
  border: 0.5px solid rgba(245, 215, 110, 0.4);
  display: flex; align-items: center; justify-content: center;
}
.visit-divider {
  width: 0.5px; height: 28px;
  background: rgba(245, 215, 110, 0.2);
}
.visit-label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(245, 215, 110, 0.6);
  margin-bottom: 3px;
}
.visit-count {
  font-size: 17px;
  font-weight: 500;
  color: #f5d76e;
}
  </style>
</head>   

<body>

  <header>
    <img src="LOGO.png" alt="Logo Rasya Parfume" class="logo">

    <h1>Rasya Parfume</h1>

    <a href="halamanutama5.html" class="cta">Temukan Sekarang</a>
  </header>

  <section id="produk">
    <h2>Koleksi Ekslusif</h2>
    <p>
      Setiap botol parfum kami dirancang dengan detail mewah,
      menghadirkan aroma yang elegan dan tahan lama.
      Cocok untuk momen istimewa maupun keseharian penuh gaya.
    </p>
  </section>

 <footer>
  <p>&copy; 2026 Rasya Parfume. Semua Hak Dilindungi.</p>
  
  <div class="visit-badge" id="visit-badge" style="display:none;">
    <div class="visit-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f5d76e" stroke-width="1.8" stroke-linecap="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <div class="visit-divider"></div>
    <div>
      <div class="visit-label">Kunjungan Anda</div>
      <div class="visit-count" id="visit-count"></div>
    </div>
  </div>
</footer>


<script>
 
 let visits = parseInt(localStorage.getItem("visits") || "0") + 1;
localStorage.setItem("visits", visits);

document.addEventListener("DOMContentLoaded", () => {
  const badge = document.getElementById("visit-badge");
  document.getElementById("visit-count").textContent = visits.toLocaleString("id-ID");
  badge.style.display = "inline-flex";
});

</script>
</body>
</html>


</body>
</html>
